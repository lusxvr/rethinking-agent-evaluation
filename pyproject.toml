[project]
name = "auto-research"
version = "0.1.0"
# Only what agent/, eval/, orchestrate.py and scripts/ import; solution dev scripts use models/<name>/dev_env.
description = "Autonomous research agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.115.0",
    "bertopic>=0.17.4",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "openai>=2.45.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.1",
    "statsmodels>=0.15.0",
    "trafilatura>=2.1.0",
]

# Not installed into agent.sif (agent.def syncs --no-dev).
[dependency-groups]
dev = [
    "huggingface-hub>=1.30.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # top-level modules: orchestrate, axes, agent, eval
